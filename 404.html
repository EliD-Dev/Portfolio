<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée - EliDev</title>
    <meta name="description" content="La page que vous recherchez n'existe pas ou a été déplacée.">
    <meta name="robots" content="noindex, follow">
    
    <style>
        /* Critical CSS inline pour la page 404 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #0d3969 0%, #0f98b1 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            text-align: center;
            max-width: 600px;
            animation: fadeIn 0.6s ease;
        }

        .error-code {
            font-size: clamp(8rem, 20vw, 15rem);
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #0f98b1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
            animation: glitch 3s infinite;
        }

        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .error-message {
            font-size: clamp(1rem, 2vw, 1.2rem);
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 0.875rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0f98b1, #0d3969);
            color: white;
            box-shadow: 0 4px 15px rgba(15, 152, 177, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(15, 152, 177, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .icon-svg {
            width: 1.2em;
            height: 1.2em;
            fill: currentColor;
            vertical-align: middle;
            margin-right: 0.5rem;
        }

        .suggestions {
            margin-top: 3rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .suggestions h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .suggestions ul {
            list-style: none;
            text-align: left;
            display: inline-block;
        }

        .suggestions li {
            margin-bottom: 0.5rem;
        }

        .suggestions a {
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
        }

        .suggestions a:hover {
            color: #0f98b1;
            transform: translateX(5px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glitch {
            0%, 100% {
                transform: translate(0);
            }
            20% {
                transform: translate(-2px, 2px);
            }
            40% {
                transform: translate(-2px, -2px);
            }
            60% {
                transform: translate(2px, 2px);
            }
            80% {
                transform: translate(2px, -2px);
            }
        }

        @media (max-width: 768px) {
            .error-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
    
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap">
    </noscript>
    
    <link rel="icon" href="./images/Logo_EliDev.webp" type="image/x-icon">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page non trouvée</h1>
        <p class="error-message">
            Oups ! La page que vous recherchez semble avoir disparu dans le cyberespace.
            Elle a peut-être été déplacée, supprimée ou n'a jamais existé.
        </p>
        
        <div class="error-actions">
            <a href="/" class="btn btn-primary">
                <svg class="icon-svg" viewBox="0 0 576 512"><path d="M575.8 255.5c0 18-15 32.1-32 32.1h-32l.7 160.2c0 2.7-.2 5.4-.5 8.1V472c0 22.1-17.9 40-40 40H456c-1.1 0-2.2 0-3.3-.1c-1.4 .1-2.8 .1-4.2 .1H416 392c-22.1 0-40-17.9-40-40V448 384c0-17.7-14.3-32-32-32H256c-17.7 0-32 14.3-32 32v64 24c0 22.1-17.9 40-40 40H160 128.1c-1.5 0-3-.1-4.5-.2c-1.2 .1-2.4 .2-3.6 .2H104c-22.1 0-40-17.9-40-40V360c0-.9 0-1.9 .1-2.8V287.6H32c-18 0-32-14-32-32.1c0-9 3-17 10-24L266.4 8c7-7 15-8 22-8s15 2 21 7L564.8 231.5c8 7 12 15 11 24z"/></svg>
                Retour à l'accueil
            </a>
            <button onclick="history.back()" class="btn btn-secondary">
                <svg class="icon-svg" viewBox="0 0 448 512"><path d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288 416 288c17.7 0 32-14.3 32-32s-14.3-32-32-32l-306.7 0L214.6 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg>
                Page précédente
            </button>
        </div>

        <div class="suggestions">
            <h2>Où voulez-vous aller ?</h2>
            <ul>
                <li><a href="/#projets">→ Découvrir mes projets</a></li>
                <li><a href="/#competences">→ Mes compétences</a></li>
                <li><a href="/#contact">→ Me contacter</a></li>
            </ul>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="./js/head.js?v=7.0000000005" defer></script>
    <script src="./js/config.js?v=7.0000000005" defer></script>

    <script>
        // Log l'erreur 404 pour analytics (si besoin)
        console.log('404 Error - Page not found:', globalThis.location.href);

        // Initialisation de la page
        async function init404Page() {
            await loadHeaderFooter();

            // Mettre à jour le titre et la méta description
            document.title = config.pageTitles['404'].title;
            const metaDescription = document.querySelector('meta[name="description"]');
            if (metaDescription) {
                metaDescription.setAttribute('content', config.pageTitles['404'].description);
            }
        }

        
        // Ajouter un effet de particules (optionnel)
        document.addEventListener('DOMContentLoaded', () => {
            const errorCode = document.querySelector('.error-code');
            let glitchInterval;
            
            errorCode.addEventListener('mouseenter', () => {
                glitchInterval = setInterval(() => {
                    errorCode.style.transform = `translate(${Math.random() * 4 - 2}px, ${Math.random() * 4 - 2}px)`;
                }, 50);
            });
            
            errorCode.addEventListener('mouseleave', () => {
                clearInterval(glitchInterval);
                errorCode.style.transform = 'translate(0, 0)';
            });
        });
    </script>
</body>
</html>
